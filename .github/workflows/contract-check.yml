name: Contract Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python syntax
        run: python -m compileall -q bridges sim/gazebo_smoke/launch sim/gazebo_smoke/setup.py

      - name: Environment bridge unit tests
        run: python -m unittest -v bridges.python.test_environment_bridge_core

      - name: Gazebo smoke static contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('sim/gazebo_smoke')
          ET.parse(root / 'package.xml')
          world = ET.parse(root / 'worlds/forklift_smoke.sdf').getroot()
          if world.tag != 'sdf':
              raise SystemExit('SDF root element missing')
          names = {x.attrib.get('name') for x in world.findall('.//model')}
          for required in {'forklift', 'pallet_A'}:
              if required not in names:
                  raise SystemExit(f'missing SDF model: {required}')
          data = json.loads((root / 'config/environment.json').read_text())
          if 'pallet_A' not in data.get('pallets', {}):
              raise SystemExit('semantic pallet_A missing')
          bridge = (root / 'config/bridge.yaml').read_text()
          for topic in ['/cmd_vel', '/odom', '/camera', '/scan']:
              if topic not in bridge:
                  raise SystemExit(f'bridge topic missing: {topic}')
          print('Gazebo smoke static contracts OK')
          PY
          for script in sim/gazebo_smoke/scripts/*.sh; do bash -n "$script"; done

      - name: JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.js pipeline.js mobile_ui.js
            src/environment/*.js
            src/evaluation/*.js
            src/policy/*.js
            src/skills/*.js
            src/learning/framework/*.js
            src/learning/plugins/*.js
            src/learning/algorithms/*.js
            src/learning/ui/*.js
            src/learning/workers/*.js
          )
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            echo "check $file"
            node --input-type=module --check < "$file"
          done
