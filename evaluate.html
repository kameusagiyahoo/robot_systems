<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Evaluation Framework v2.4</title><link rel="stylesheet" href="./style.css">
<style>
body{min-height:100dvh;overflow:hidden;background:#eef2f5}.eval-screen{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:760px;margin:auto}.eval-top{padding:9px 11px;background:#17202a;color:#fff;display:flex;align-items:center;justify-content:space-between}.eval-top strong{font-size:.95rem}.eval-top span{font-size:.68rem;opacity:.65}.back-link{color:#fff;text-decoration:none;font-weight:800;font-size:.75rem;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:6px 8px}.eval-main{min-height:0;padding:7px;display:grid;grid-template-rows:auto auto 1fr;gap:7px;overflow:hidden}.skill-focus,.score-card,.eval-grid{background:#fff;border:1px solid #dce4e9;border-radius:11px;padding:10px}.skill-focus{display:flex;justify-content:space-between;gap:8px;align-items:center}.skill-focus small{display:block;font-size:.62rem;color:#71808a;font-weight:800}.skill-focus h1{font-size:1rem;margin:1px 0}.skill-focus p{font-size:.68rem;margin:0;color:#66737c}.skill-number{font-size:.68rem;font-weight:900;background:#edf2f5;border-radius:999px;padding:5px 7px}.score-card{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.score-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#edf1f4;color:#66737c;font-size:.9rem;font-weight:900}.score-ring.good{background:#dff2e6;color:#176b3b}.score-ring.bad{background:#ffe1de;color:#a11d14}.score-card h2{font-size:.9rem;margin:0}.score-card p{font-size:.68rem;color:#6b7780;margin:3px 0}.eval-grid{min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#f7f9fb;border-radius:9px;padding:8px}.metric span{display:block;font-size:.58rem;color:#7b8790;font-weight:800}.metric strong{display:block;font-size:.74rem;margin-top:2px;overflow-wrap:anywhere}.metric.full{grid-column:1/-1}.eval-settings{display:grid;grid-template-columns:1fr 1fr;gap:7px}.eval-settings label{display:grid;gap:3px;font-size:.62rem;color:#6b7780}.eval-settings input,.eval-settings select{width:100%;min-height:34px;border:1px solid #cbd6dd;border-radius:8px;padding:6px;background:#fff}.failure-box{font-size:.66rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.comparison{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch;margin-top:5px}.compare-side{background:#fff;border:1px solid #dce4e9;border-radius:8px;padding:8px;text-align:center}.compare-side span{font-size:.6rem}.compare-side strong{font-size:1rem;margin-top:3px}.compare-side small{display:block;font-size:.58rem;color:#71808a;margin-top:3px}.compare-vs{display:grid;place-items:center;font-size:.65rem;font-weight:900;color:#75828b}.compare-delta{margin-top:6px;font-size:.65rem;font-weight:850;text-align:center;color:#35556d}.eval-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));background:#fff;border-top:1px solid #dce4e9}.eval-actions button,.eval-actions a{min-height:42px;font-size:.76rem}.run-eval{background:#17202a;color:#fff;border-color:#17202a}.compare-btn{background:#197a43;color:#fff;border-color:#197a43}.skill-link{background:#245b89;color:#fff;text-decoration:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:850}.progress{font-size:.66rem;color:#9a6700;font-weight:800}.hidden{display:none!important}@media(min-width:700px){body{overflow:auto}.eval-screen{height:auto;min-height:100dvh}.eval-main,.eval-grid{overflow:visible}}
</style>
</head>
<body><div class="eval-screen">
<header class="eval-top"><div><strong>Skill Evaluation Framework</strong> <span>v2.4</span></div><a class="back-link" href="./index.html">← Task</a></header>
<main class="eval-main">
<section class="skill-focus"><div><small>Task Pipeline / Skill</small><h1 id="skillTitle">読み込み中...</h1><p id="skillDesc"></p></div><div id="skillNumber" class="skill-number">- / 8</div></section>
<section class="score-card"><div id="scoreRing" class="score-ring">－</div><div><h2 id="scoreTitle">未評価</h2><p id="scoreMessage">Plugin定義を読み込み中...</p><div id="progress" class="progress hidden"></div></div></section>
<section class="eval-grid">
<div class="metric full"><span>Evaluation Plugin</span><strong id="pluginState">-</strong></div>
<div class="metric full"><span>Scenario Adapter</span><strong id="scenarioAdapterState">-</strong></div>
<div class="metric full"><span>評価条件</span><div id="evaluationParameters" class="eval-settings"></div></div>
<div class="metric full"><span>Classic vs Learned</span><div class="comparison"><div class="compare-side"><span>Classic</span><strong id="classicScore">-</strong><small id="classicMeta">未評価</small></div><div class="compare-vs">VS</div><div class="compare-side"><span>Learned</span><strong id="learnedScore">-</strong><small id="learnedMeta">未評価</small></div></div><div id="compareDelta" class="compare-delta">同じ条件で比較できます。</div></div>
<div id="metricHost" style="display:contents"></div>
<div class="metric full"><span>評価の意味</span><strong id="evalNote">Plugin固有の指標を表示します。</strong></div>
</section></main>
<footer class="eval-actions"><button id="runBtn" class="run-eval">現在Policyを評価</button><button id="compareBtn" class="compare-btn">Classic vs Learned</button><a id="learnLink" class="skill-link" href="#">学習 / Policy</a><button id="clearBtn">評価履歴を削除</button><button id="nextBtn">次のSkill →</button></footer>
</div>
<script type="module" src="./src/learning/ui/evaluation_page.js"></script>
</body></html>
