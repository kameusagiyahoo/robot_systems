<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Evaluation v1.9</title><link rel="stylesheet" href="./style.css">
<style>
body{min-height:100dvh;overflow:hidden;background:#eef2f5}.eval-screen{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:760px;margin:auto}.eval-top{padding:9px 11px;background:#17202a;color:#fff;display:flex;align-items:center;justify-content:space-between}.eval-top strong{font-size:.95rem}.eval-top span{font-size:.68rem;opacity:.65}.back-link{color:#fff;text-decoration:none;font-weight:800;font-size:.75rem;border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:6px 8px}.eval-main{min-height:0;padding:7px;display:grid;grid-template-rows:auto auto 1fr;gap:7px;overflow:hidden}.skill-focus,.score-card,.eval-grid{background:#fff;border:1px solid #dce4e9;border-radius:11px;padding:10px}.skill-focus{display:flex;justify-content:space-between;gap:8px;align-items:center}.skill-focus small{display:block;font-size:.62rem;color:#71808a;font-weight:800}.skill-focus h1{font-size:1rem;margin:1px 0}.skill-focus p{font-size:.68rem;margin:0;color:#66737c}.skill-number{font-size:.68rem;font-weight:900;background:#edf2f5;border-radius:999px;padding:5px 7px}.score-card{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.score-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#edf1f4;color:#66737c;font-size:.9rem;font-weight:900}.score-ring.good{background:#dff2e6;color:#176b3b}.score-ring.bad{background:#ffe1de;color:#a11d14}.score-card h2{font-size:.9rem;margin:0}.score-card p{font-size:.68rem;color:#6b7780;margin:3px 0}.eval-grid{min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#f7f9fb;border-radius:9px;padding:8px}.metric span{display:block;font-size:.58rem;color:#7b8790;font-weight:800}.metric strong{display:block;font-size:.74rem;margin-top:2px;overflow-wrap:anywhere}.metric.full{grid-column:1/-1}.eval-settings{display:grid;grid-template-columns:1fr 1fr;gap:7px}.eval-settings label{display:grid;gap:3px;font-size:.62rem;color:#6b7780}.eval-settings input,.eval-settings select{width:100%;min-height:34px;border:1px solid #cbd6dd;border-radius:8px;padding:6px;background:#fff}.failure-box{font-size:.66rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.eval-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));background:#fff;border-top:1px solid #dce4e9}.eval-actions button,.eval-actions a{min-height:44px;font-size:.8rem}.run-eval{background:#17202a;color:#fff;border-color:#17202a}.skill-link{background:#245b89;color:#fff;text-decoration:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:850}.progress{font-size:.66rem;color:#9a6700;font-weight:800}.hidden{display:none!important}@media(min-width:700px){body{overflow:auto}.eval-screen{height:auto;min-height:100dvh}.eval-main,.eval-grid{overflow:visible}}
</style>
</head>
<body><div class="eval-screen">
<header class="eval-top"><div><strong>Skill Evaluation</strong> <span>v1.9</span></div><a class="back-link" href="./index.html">← Task</a></header>
<main class="eval-main">
<section class="skill-focus"><div><small>Task Pipeline / Skill</small><h1 id="skillTitle">読み込み中...</h1><p id="skillDesc"></p></div><div id="skillNumber" class="skill-number">- / 8</div></section>
<section class="score-card"><div id="scoreRing" class="score-ring">－</div><div><h2 id="scoreTitle">未評価</h2><p id="scoreMessage">このSkillだけを独立して複数回テストします。</p><div id="progress" class="progress hidden"></div></div></section>
<section class="eval-grid">
<div class="metric full"><span>評価条件</span><div class="eval-settings"><label>Trials<input id="trials" type="number" min="1" max="100" value="20"></label><label>Seed<input id="seed" type="number" value="42"></label><label>Controller<select id="controller"><option value="pure_pursuit">Pure Pursuit</option><option value="rule_waypoint">Rule Waypoint</option><option value="pid_path">PID Path</option></select></label><label>Policy<strong id="policyState">-</strong></label></div></div>
<div class="metric"><span>成功率</span><strong id="successRate">-</strong></div><div class="metric"><span>衝突率</span><strong id="collisionRate">-</strong></div>
<div class="metric"><span>平均制御Step</span><strong id="avgTicks">-</strong></div><div class="metric"><span>平均Sim時間</span><strong id="avgTime">-</strong></div>
<div class="metric"><span>最終位置誤差</span><strong id="finalError">-</strong></div><div class="metric"><span>姿勢誤差</span><strong id="yawError">-</strong></div>
<div class="metric full"><span>失敗理由</span><pre id="failureReasons" class="failure-box">未評価</pre></div>
<div class="metric full"><span>評価の意味</span><strong id="evalNote">Task全体ではなく、このSkill単体の性能です。</strong></div>
</section></main>
<footer class="eval-actions"><button id="runBtn" class="run-eval">このSkillを評価</button><a id="learnLink" class="skill-link" href="#">学習 / Policy</a><button id="clearBtn">評価を削除</button><button id="nextBtn">次のSkill →</button></footer>
</div>
<script type="module">
import {SKILL_LEARNING_REGISTRY,getSkillDefinition,skillLearningState,loadSkillEvaluation,clearSkillEvaluation} from './src/learning/skill_learning_registry.js';
import {evaluateSkill} from './src/evaluation/skill_evaluator.js';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let skillId=params.get('skill')||'align_to_pallet';if(!getSkillDefinition(skillId))skillId='align_to_pallet';const def=getSkillDefinition(skillId);
const pct=v=>Number.isFinite(v)?`${(v*100).toFixed(0)}%`:'-';const num=(v,d=1)=>Number.isFinite(v)?Number(v).toFixed(d):'-';
function render(){const state=skillLearningState(skillId),e=loadSkillEvaluation(skillId);$('#skillTitle').textContent=`${def.code} / ${def.label}`;$('#skillDesc').textContent=def.desc;$('#skillNumber').textContent=`${def.order} / ${SKILL_LEARNING_REGISTRY.length}`;$('#policyState').textContent=state.policy==='learned'&&state.runtimeLearning?'Learned':'Classic / Runtime';$('#learnLink').href=`./learn.html?skill=${encodeURIComponent(skillId)}`;
 const ring=$('#scoreRing');ring.className='score-ring';if(!e){ring.textContent='－';$('#scoreTitle').textContent='未評価';$('#scoreMessage').textContent='このSkillだけを独立して複数回テストします。'}else{ring.textContent=pct(e.successRate);ring.classList.add(e.successRate>=.8?'good':'bad');$('#scoreTitle').textContent=e.successRate>=.8?'評価良好':'改善候補';$('#scoreMessage').textContent=`${e.trials} trials / ${String(e.evaluatedAt||'').replace('T',' ').slice(0,16)}`;$('#controller').value=e.controller||'pure_pursuit'}
 $('#successRate').textContent=e?pct(e.successRate):'-';$('#collisionRate').textContent=e?pct(e.collisionRate):'-';$('#avgTicks').textContent=e?num(e.avgControlTicks,0):'-';$('#avgTime').textContent=e?`${num(e.avgSimTimeSec,1)} s`:'-';$('#finalError').textContent=e&&Number.isFinite(e.avgFinalError)?`${num(e.avgFinalError,1)} px`:'対象外';$('#yawError').textContent=e&&Number.isFinite(e.avgYawError)?`${num(e.avgYawError,1)}°`:'対象外';$('#failureReasons').textContent=e?(Object.keys(e.failures||{}).length?JSON.stringify(e.failures,null,2):'なし'):'未評価';
 $('#evalNote').textContent=state.policy==='learned'&&state.runtimeLearning?'現在選択中のLearned Policyを実際のSkill実行で評価します。':state.trained&&!state.runtimeLearning?'学習モデルは保存されていますが実行未接続のため、現在のRuntime Policyを評価します。':'現在のRuntime Policyを評価します。';}
render();
$('#runBtn').onclick=async()=>{const btn=$('#runBtn');btn.disabled=true;$('#progress').classList.remove('hidden');$('#scoreTitle').textContent='評価中...';try{await evaluateSkill(skillId,{trials:Number($('#trials').value)||20,seed:Number($('#seed').value)||42,controller:$('#controller').value,onProgress:(i,n)=>{$('#progress').textContent=`${i} / ${n} trials`}})}finally{btn.disabled=false;$('#progress').classList.add('hidden');render()}};
$('#clearBtn').onclick=()=>{clearSkillEvaluation(skillId);render()};
$('#nextBtn').onclick=()=>{const i=SKILL_LEARNING_REGISTRY.findIndex(s=>s.id===skillId),next=SKILL_LEARNING_REGISTRY[(i+1)%SKILL_LEARNING_REGISTRY.length];location.href=`./evaluate.html?skill=${encodeURIComponent(next.id)}`};
</script></body></html>
